name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server tests
        run: npm run test -w server -- --runInBand

      - name: Client lint
        run: npm run lint -w client

      - name: Client build
        run: npm run build -w client

      - name: Server build
        run: npm run build
